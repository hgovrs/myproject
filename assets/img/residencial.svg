<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Setor residencial">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a1218"/>
      <stop offset="1" stop-color="#400307"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <g opacity="0.95">
    <!-- house body -->
    <rect x="170" y="290" width="260" height="210" rx="6" fill="#ffffff" opacity="0.12"/>
    <!-- roof -->
    <path d="M140 300 L300 170 L460 300 Z" fill="#ffffff" opacity="0.18"/>
    <!-- door -->
    <rect x="278" y="390" width="44" height="110" rx="4" fill="#ffd34d" opacity="0.55"/>
    <!-- windows glowing -->
    <g fill="#ffd34d" opacity="0.9">
      <rect x="200" y="330" width="46" height="46" rx="3"/>
      <rect x="354" y="330" width="46" height="46" rx="3"/>
    </g>
    <!-- pendant lamp / bulb -->
    <line x1="300" y1="150" x2="300" y2="210" stroke="#e3e3e3" stroke-width="4"/>
    <circle cx="300" cy="230" r="26" fill="#ffd34d" opacity="0.95"/>
    <g stroke="#ffd34d" stroke-width="4" opacity="0.7" stroke-linecap="round">
      <line x1="300" y1="188" x2="300" y2="176"/>
      <line x1="336" y1="230" x2="350" y2="230"/>
      <line x1="264" y1="230" x2="250" y2="230"/>
      <line x1="326" y1="204" x2="336" y2="194"/>
      <line x1="274" y1="204" x2="264" y2="194"/>
    </g>
  </g>
</svg>
