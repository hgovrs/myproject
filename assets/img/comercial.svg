<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Setor comercial">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f4d73"/>
      <stop offset="1" stop-color="#0f2a41"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <g opacity="0.9">
    <!-- storefront buildings -->
    <rect x="80" y="230" width="150" height="270" rx="6" fill="#ffffff" opacity="0.14"/>
    <rect x="240" y="170" width="130" height="330" rx="6" fill="#ffffff" opacity="0.10"/>
    <rect x="380" y="270" width="150" height="230" rx="6" fill="#ffffff" opacity="0.14"/>
    <!-- windows -->
    <g fill="#ffd34d" opacity="0.85">
      <rect x="100" y="255" width="26" height="26"/><rect x="140" y="255" width="26" height="26"/><rect x="180" y="255" width="26" height="26"/>
      <rect x="100" y="300" width="26" height="26"/><rect x="140" y="300" width="26" height="26"/><rect x="180" y="300" width="26" height="26"/>
      <rect x="400" y="295" width="26" height="26"/><rect x="440" y="295" width="26" height="26"/><rect x="480" y="295" width="26" height="26"/>
      <rect x="400" y="340" width="26" height="26"/><rect x="440" y="340" width="26" height="26"/><rect x="480" y="340" width="26" height="26"/>
    </g>
    <!-- awning -->
    <rect x="240" y="170" width="130" height="26" fill="#400307" opacity="0.75"/>
  </g>
  <!-- bolt accent -->
  <path d="M330 60 L270 200 h44 l-20 110 96 -150 h-46 l26 -110 z" fill="#ffd34d" opacity="0.9"/>
</svg>
